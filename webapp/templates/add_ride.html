<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Lisa uus sõit</title>
</head>
<body>
    <h2>Lisa uus sõit</h2>
    <form action="/lisa" method="post">
        <label>Kuupäev:</label>
        <input type="date" name="kuupaev" required><br><br>

        <label>Marsruut:</label>
        <input type="text" name="marsruut" required><br><br>

        <label>Kilomeetrid:</label>
        <input type="number" name="kilomeetrid" step="0.1" required><br><br>

        <button type="submit">Lisa</button>
    </form>

    <p><a href="/">Tagasi avalehele</a></p>
</body>
</html>
