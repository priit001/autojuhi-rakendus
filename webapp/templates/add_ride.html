<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Lisa uus sõit</title>
</head>
<body>
    <h2>Lisa uus sõit</h2>
    <form action="/lisa" method="post">
        <label>Kuupäev:</label>
        <input type="date" name="date" required><br><br>

        <label>Kilomeetrid:</label>
        <input type="number" name="km" step="0.1" required><br><br>

        <label>Tulu (€):</label>
        <input type="number" name="income" step="0.01" required><br><br>

        <button type="submit">Lisa</button>
    </form>

    <p><a href="/">Tagasi avalehele</a></p>
</body>
</html>
