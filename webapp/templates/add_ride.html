<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Lisa uus sõit</title>
</head>
<body>
    <h2>Lisa uus sõit</h2>
    {% if error %}
    <p role="alert">{{ error }}</p>
    {% endif %}
    <form action="/lisa" method="post">
        <label>Kuupäev:</label>
        <input type="date" name="kuupaev" value="{{ kuupaev|default('') }}" required><br><br>

        <label>Marsruut:</label>
        <input type="text" name="marsruut" value="{{ marsruut|default('') }}" required><br><br>

        <label>Kilomeetrid:</label>
        <input type="number" name="kilomeetrid" min="0" step="0.1" value="{{ kilomeetrid|default('') }}" required><br><br>

        <button type="submit">Lisa</button>
    </form>

    <p><a href="/">Tagasi avalehele</a></p>
</body>
</html>
