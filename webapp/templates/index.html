<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Avaleht</title>
</head>
<body>
    <h1>🚗 Autojuhi Rakendus</h1>
<p>
  <a href="/export">
    <button type="button">Ekspordi CSV</button>
  </a>
</p>
<form action="/import" method="post" enctype="multipart/form-data">
  <label for="csv-file">Impordi sõidud CSV-failist:</label>
  <input id="csv-file" type="file" name="file" accept=".csv,text/csv" required>
  <button type="submit">Impordi CSV</button>
</form>
{% if import_message %}
<p role="status">{{ import_message }}</p>
{% endif %}
<a href="/stats">
  <button type="button">Statistika</button>
</a>

<a href="/stats/kuud">
  <button type="button">Kuude statistika</button>
</a>

    <ul>
        <li><a href="/lisa">📥 Lisa uus sõit</a></li>
        <li><a href="/statistika">📊 Vaata statistikat</a></li>
        <li><a href="/soidud">📋 Vaata kõiki sõite</a></li>
        <li><a href="/export">📤 Ekspordi CSV</a></li>
    </ul>
</body>
</html>
