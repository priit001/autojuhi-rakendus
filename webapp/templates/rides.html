<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kõik sõidud</title>
</head>
<body>
    <h2>Kõik sõidud</h2>

    <table border="1" cellpadding="5">
        <tr>
            <th>Kuupäev</th>
            <th>Marsruut</th>
            <th>Kilomeetrid</th>
            <th></th>
        </tr>

        {% for r in rides %}
<tr>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>
        <form action="/kustuta/{{ r[0] }}" method="post" style="display:inline;">
            <button type="submit">Kustuta</button>
        </form>
    </td>
</tr>
{% endfor %}


    </table>

    <p><a href="/">Tagasi avalehele</a></p>
</body>
</html>
<p>
    <a href="/export">Ekspordi CSV</a>
</p>
